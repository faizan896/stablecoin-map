<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoinMap — Stablecoin Acceptance Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --panel2:#1c242e; --line:#2a333f;
    --txt:#e6edf3; --muted:#8b98a5; --accent:#2775ca; --accent2:#26a17b;
    --btc:#f7931a; --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt)}
  #app{display:flex;flex-direction:column;height:100%}

  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;flex:0 0 auto}
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-weight:700;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
  .logo span{color:var(--accent2)}
  .search{display:flex;gap:8px;flex:1;min-width:280px;flex-wrap:wrap}
  .field{position:relative;flex:1;min-width:130px}
  .field input{width:100%;padding:9px 12px 9px 32px;background:var(--panel2);border:1px solid var(--line);
    border-radius:var(--radius);color:var(--txt);font-size:14px;outline:none}
  .field input:focus{border-color:var(--accent)}
  .field .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
  button{font-family:inherit;cursor:pointer}
  .btn{padding:9px 16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:14px}
  .btn:hover{border-color:var(--accent)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn-primary:hover{filter:brightness(1.1)}

  .chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
  .chips .lbl{color:var(--muted);font-size:12px;margin-right:2px}
  .chip{padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;
    color:var(--muted);font-size:12px;font-weight:600;transition:.12s}
  .chip:hover{color:var(--txt)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.on[data-coin="BTC"],.chip.on[data-coin="Lightning"]{background:var(--btc);border-color:var(--btc);color:#111}
  .chip.on[data-coin="USDT"],.chip.on[data-coin="DAI"]{background:var(--accent2);border-color:var(--accent2)}

  main{flex:1;display:flex;min-height:0}
  #list{width:370px;flex:0 0 370px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
  .list-head{padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);
    position:sticky;top:0;background:var(--panel);z-index:5;display:flex;justify-content:space-between;align-items:center}
  .card{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
  .card:hover{background:var(--panel2)}
  .card.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
  .card h3{margin:0 0 3px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
  .card .meta{color:var(--muted);font-size:12.5px;margin-bottom:7px}
  .coins{display:flex;gap:5px;flex-wrap:wrap}
  .coin{font-size:10.5px;font-weight:700;padding:2.5px 7px;border-radius:5px;letter-spacing:.3px}
  .c-USDC{background:rgba(39,117,202,.18);color:#5ba8f5}
  .c-USDT{background:rgba(38,161,123,.18);color:#3ecf9e}
  .c-DAI{background:rgba(245,172,39,.15);color:#f5ac27}
  .c-PYUSD{background:rgba(120,110,240,.18);color:#a49bff}
  .c-BTC{background:rgba(247,147,26,.15);color:#f7931a}
  .c-Lightning{background:rgba(247,147,26,.15);color:#ffb84d}
  .pending{font-size:9.5px;font-weight:700;background:rgba(245,172,39,.18);color:#f5ac27;padding:2px 6px;border-radius:4px}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6}
  #map{flex:1;min-height:0;background:#0d1117}

  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--txt);border-radius:var(--radius)}
  .leaflet-popup-tip{background:var(--panel)}
  .leaflet-popup-content{margin:12px 14px;font-size:13px}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
  .pin{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50% 50% 50% 4px;
    transform:rotate(45deg);border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.5)}
  .pin i{transform:rotate(-45deg);font-style:normal;font-size:12px}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:470px;
    max-height:88vh;overflow-y:auto;padding:22px}
  .modal h2{margin:0 0 4px;font-size:19px}
  .modal p.sub{margin:0 0 18px;color:var(--muted);font-size:13px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:600}
  input[type=text],select,textarea{width:100%;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;color:var(--txt);font-size:14px;font-family:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  .pickcoins{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .err{color:#f8736f;font-size:12px;margin-top:10px;display:none}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent2);
    color:#04140e;font-weight:600;padding:11px 20px;border-radius:10px;z-index:2000;opacity:0;transition:.3s;font-size:14px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:820px){
    main{flex-direction:column}
    #list{width:100%;flex:0 0 45%;border-right:none;border-bottom:1px solid var(--line)}
    .logo{width:100%}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="topbar">
      <div class="logo">Coin<span>Map</span> · Stablecoin Acceptance</div>
      <div class="search">
        <div class="field"><span class="ic">&#128269;</span><input id="q" placeholder="Coffee, restaurant, salon..."></div>
        <div class="field"><span class="ic">&#128205;</span><input id="city" placeholder="Karachi"></div>
        <button class="btn btn-primary" id="go">Search</button>
      </div>
      <button class="btn" id="add">+ Add your business</button>
    </div>
    <div class="chips" id="chips"><span class="lbl">Accepts:</span></div>
  </header>

  <main>
    <div id="list">
      <div class="list-head"><span id="count">—</span><span id="hint">click a result to zoom</span></div>
      <div id="cards"></div>
    </div>
    <div id="map"></div>
  </main>
</div>

<!-- submission modal -->
<div class="overlay" id="ov">
  <div class="modal">
    <h2>List your business</h2>
    <p class="sub">Free. Submissions are reviewed before going live.</p>

    <label>Business name *</label>
    <input type="text" id="f-name" placeholder="Cafe Aylanto">

    <div class="row">
      <div>
        <label>Category *</label>
        <select id="f-cat"></select>
      </div>
      <div>
        <label>City *</label>
        <select id="f-city"></select>
      </div>
    </div>

    <label>Address</label>
    <input type="text" id="f-addr" placeholder="Zamzama Blvd, Phase 5, DHA">

    <label>Accepted coins * (pick at least one)</label>
    <div class="pickcoins" id="f-coins"></div>

    <label>Contact (phone / @handle)</label>
    <input type="text" id="f-contact" placeholder="+92 300 1234567">

    <label>Pin location</label>
    <div class="hint" id="pinhint">Click anywhere on the map to drop an exact pin. Otherwise the city centre is used.</div>

    <div class="err" id="err"></div>
    <div class="modal-actions">
      <button class="btn" id="cancel">Cancel</button>
      <button class="btn btn-primary" id="submit">Submit for review</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ---------------- config ---------------- */
const COINS = ["USDC","USDT","DAI","PYUSD","BTC","Lightning"];
const CATS  = ["Coffee","Restaurant","Grocery","Electronics","Clothing","Hotel","Pharmacy","Services"];
const CITIES = {
  "Karachi":      [24.8607, 67.0011],
  "Lahore":       [31.5204, 74.3587],
  "Islamabad":    [33.6844, 73.0479],
  "Dubai":        [25.2048, 55.2708],
  "Lisbon":       [38.7223, -9.1393],
  "Buenos Aires": [-34.6037,-58.3816]
};
const CAT_ICON = {Coffee:"☕",Restaurant:"🍽",Grocery:"🛒",Electronics:"💻",
  Clothing:"👕",Hotel:"🏨",Pharmacy:"💊",Services:"🔧"};

/* ---------------- seed data ---------------- */
const SEED = [
  {n:"Kaffee Beans",       c:"Coffee",      city:"Karachi", a:"Zamzama Blvd, DHA Phase 5",   ll:[24.8145,67.0324], coins:["USDC","USDT"]},
  {n:"Chai Wala Co.",      c:"Coffee",      city:"Karachi", a:"Boat Basin, Clifton",         ll:[24.8215,67.0316], coins:["Lightning","BTC"]},
  {n:"Espresso Lab",       c:"Coffee",      city:"Karachi", a:"Bukhari Commercial",          ll:[24.8085,67.0621], coins:["USDC"]},
  {n:"Kolachi Grill",      c:"Restaurant",  city:"Karachi", a:"Do Darya, DHA Phase 8",       ll:[24.7815,67.0553], coins:["USDT","USDC","BTC"]},
  {n:"Naya Mart",          c:"Grocery",     city:"Karachi", a:"Tariq Road",                  ll:[24.8709,67.0630], coins:["USDT"]},
  {n:"TechHub Karachi",    c:"Electronics", city:"Karachi", a:"Saddar Electronics Market",   ll:[24.8607,67.0225], coins:["USDT","BTC","USDC"]},
  {n:"Beach Luxury Hotel", c:"Hotel",       city:"Karachi", a:"M.T. Khan Road",              ll:[24.8452,67.0080], coins:["USDC","PYUSD"]},

  {n:"Cafe Aylanto",       c:"Restaurant",  city:"Lahore",  a:"MM Alam Road, Gulberg",       ll:[31.5145,74.3489], coins:["USDC","USDT"]},
  {n:"Anarkali Threads",   c:"Clothing",    city:"Lahore",  a:"Liberty Market",              ll:[31.5109,74.3438], coins:["USDT"]},
  {n:"Gloria Coffee",      c:"Coffee",      city:"Lahore",  a:"DHA Phase 4, Y Block",        ll:[31.4732,74.4103], coins:["Lightning","USDC"]},
  {n:"Model Town Pharmacy",c:"Pharmacy",    city:"Lahore",  a:"Model Town Link Rd",          ll:[31.4805,74.3239], coins:["USDT","DAI"]},

  {n:"Burning Brownie",    c:"Coffee",      city:"Islamabad",a:"F-7 Markaz",                 ll:[33.7180,73.0551], coins:["USDC","Lightning"]},
  {n:"Monal Restaurant",   c:"Restaurant",  city:"Islamabad",a:"Pir Sohawa Road",            ll:[33.7500,73.0800], coins:["BTC","USDT"]},
  {n:"Blue Area Repairs",  c:"Services",    city:"Islamabad",a:"Jinnah Ave, Blue Area",      ll:[33.7106,73.0551], coins:["USDT"]},
  {n:"Safa Gold Grocers",  c:"Grocery",     city:"Islamabad",a:"F-7 Jinnah Super",           ll:[33.7226,73.0505], coins:["USDC","DAI"]},

  {n:"Arabica Roasters",   c:"Coffee",      city:"Dubai",   a:"JLT Cluster D",               ll:[25.0693,55.1416], coins:["USDC","USDT","PYUSD"]},
  {n:"Crypto Cafe DIFC",   c:"Coffee",      city:"Dubai",   a:"Gate Avenue, DIFC",           ll:[25.2110,55.2810], coins:["USDC","BTC","Lightning","DAI"]},
  {n:"Souk Electronics",   c:"Electronics", city:"Dubai",   a:"Al Fahidi St, Bur Dubai",     ll:[25.2632,55.2972], coins:["USDT","BTC"]},
  {n:"Marina Boutique",    c:"Clothing",    city:"Dubai",   a:"Dubai Marina Walk",           ll:[25.0805,55.1403], coins:["USDC"]},

  {n:"Copenhagen Coffee",  c:"Coffee",      city:"Lisbon",  a:"R. Nova da Piedade 10",       ll:[38.7118,-9.1470], coins:["Lightning","BTC","USDC"]},
  {n:"Time Out Market",    c:"Restaurant",  city:"Lisbon",  a:"Av. 24 de Julho",             ll:[38.7071,-9.1459], coins:["BTC","USDT"]},
  {n:"Bairro Grocer",      c:"Grocery",     city:"Lisbon",  a:"Bairro Alto",                 ll:[38.7139,-9.1459], coins:["USDC","DAI"]},

  {n:"Cafe Tortoni",       c:"Coffee",      city:"Buenos Aires",a:"Av. de Mayo 825",         ll:[-34.6086,-58.3777],coins:["USDT","USDC"]},
  {n:"Palermo Steakhouse", c:"Restaurant",  city:"Buenos Aires",a:"Palermo Soho",            ll:[-34.5885,-58.4270],coins:["USDT","BTC"]},
  {n:"Recoleta Farmacia",  c:"Pharmacy",    city:"Buenos Aires",a:"Av. Santa Fe 1800",       ll:[-34.5950,-58.3920],coins:["USDT"]}
];

/* ---------------- state ---------------- */
const store = {
  read(){ try{ return JSON.parse(localStorage.getItem("coinmap_user")||"[]"); }catch(e){ return mem; } },
  write(v){ mem = v; try{ localStorage.setItem("coinmap_user", JSON.stringify(v)); }catch(e){} }
};
let mem = [];
let places = [];
let activeCoins = new Set();
let selected = null;
let pendingPin = null;
let markers = [];

function loadPlaces(){
  const user = store.read().map(p => Object.assign({}, p, {pending:true}));
  places = SEED.map((p,i) => Object.assign({id:"s"+i}, p)).concat(user);
}

/* ---------------- map ---------------- */
const map = L.map("map", {zoomControl:true}).setView(CITIES.Karachi, 12);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19, subdomains:'abcd'
}).addTo(map);

const layer = L.layerGroup().addTo(map);
let pinMarker = null;

map.on("click", e => {
  if(!document.getElementById("ov").classList.contains("show")) return;
  pendingPin = [e.latlng.lat, e.latlng.lng];
  if(pinMarker) map.removeLayer(pinMarker);
  pinMarker = L.marker(e.latlng).addTo(map);
  document.getElementById("pinhint").innerHTML =
    "Pin set: <b>"+pendingPin[0].toFixed(4)+", "+pendingPin[1].toFixed(4)+"</b> — click again to move it.";
});

function iconFor(p){
  const primary = p.coins[0];
  const bg = ({USDC:"#2775ca",USDT:"#26a17b",DAI:"#f5ac27",PYUSD:"#786ef0",BTC:"#f7931a",Lightning:"#f7931a"})[primary] || "#2775ca";
  return L.divIcon({
    className:"", iconSize:[28,28], iconAnchor:[14,26], popupAnchor:[0,-24],
    html:'<div class="pin" style="background:'+bg+'"><i>'+(CAT_ICON[p.c]||"📍")+'</i></div>'
  });
}

/* ---------------- filtering ---------------- */
function matches(p, q, city){
  if(city){
    const c = city.toLowerCase();
    if(!p.city.toLowerCase().includes(c)) return false;
  }
  if(q){
    const s = (p.n+" "+p.c+" "+(p.a||"")).toLowerCase();
    const ok = q.toLowerCase().split(/\s+/).every(t => s.includes(t));
    if(!ok) return false;
  }
  if(activeCoins.size){
    if(!p.coins.some(c => activeCoins.has(c))) return false;
  }
  return true;
}

function render(fly){
  const q = document.getElementById("q").value.trim();
  const city = document.getElementById("city").value.trim();
  const res = places.filter(p => matches(p,q,city));

  // list
  const cards = document.getElementById("cards");
  document.getElementById("count").textContent =
    res.length + (res.length===1 ? " place" : " places") + (city ? " in "+city : "");
  cards.innerHTML = "";
  if(!res.length){
    cards.innerHTML = '<div class="empty">No matches.<br>Try a broader search, or clear the coin filters.<br><br>'+
      'Know a place that accepts stablecoins?<br>Use <b>+ Add your business</b>.</div>';
  }
  res.forEach(p => {
    const d = document.createElement("div");
    d.className = "card" + (selected===p.id ? " sel" : "");
    d.innerHTML = '<h3>'+esc(p.n)+(p.pending?' <span class="pending">PENDING</span>':'')+'</h3>'+
      '<div class="meta">'+(CAT_ICON[p.c]||"")+' '+esc(p.c)+' &middot; '+esc(p.a||p.city)+'</div>'+
      '<div class="coins">'+p.coins.map(c=>'<span class="coin c-'+c+'">'+c+'</span>').join('')+'</div>';
    d.onclick = () => { selected = p.id; map.flyTo(p.ll, 16, {duration:.7}); render(false);
      const m = markers.find(x=>x.id===p.id); if(m) m.marker.openPopup(); };
    cards.appendChild(d);
  });

  // markers
  layer.clearLayers(); markers = [];
  res.forEach(p => {
    const m = L.marker(p.ll, {icon:iconFor(p)}).addTo(layer);
    m.bindPopup('<b>'+esc(p.n)+'</b><br><span style="color:#8b98a5">'+esc(p.c)+' &middot; '+esc(p.a||p.city)+'</span><br><br>'+
      p.coins.map(c=>'<span class="coin c-'+c+'">'+c+'</span>').join(' '));
    markers.push({id:p.id, marker:m});
  });

  if(fly && res.length){
    const key = Object.keys(CITIES).find(k => city && k.toLowerCase().includes(city.toLowerCase()));
    if(key) map.flyTo(CITIES[key], 12, {duration:.8});
    else map.fitBounds(L.latLngBounds(res.map(p=>p.ll)).pad(.25), {maxZoom:14});
  }
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------------- chips ---------------- */
const chipBox = document.getElementById("chips");
COINS.forEach(c => {
  const b = document.createElement("button");
  b.className = "chip"; b.dataset.coin = c; b.textContent = c;
  b.onclick = () => { activeCoins.has(c) ? activeCoins.delete(c) : activeCoins.add(c);
    b.classList.toggle("on"); render(false); };
  chipBox.appendChild(b);
});

/* ---------------- form setup ---------------- */
const selCat = document.getElementById("f-cat");
CATS.forEach(c => selCat.add(new Option(c,c)));
const selCity = document.getElementById("f-city");
Object.keys(CITIES).forEach(c => selCity.add(new Option(c,c)));

const coinBox = document.getElementById("f-coins");
let formCoins = new Set();
COINS.forEach(c => {
  const b = document.createElement("button");
  b.className="chip"; b.dataset.coin=c; b.textContent=c; b.type="button";
  b.onclick = () => { formCoins.has(c)?formCoins.delete(c):formCoins.add(c); b.classList.toggle("on"); };
  coinBox.appendChild(b);
});

function openModal(){ document.getElementById("ov").classList.add("show"); }
function closeModal(){
  document.getElementById("ov").classList.remove("show");
  if(pinMarker){ map.removeLayer(pinMarker); pinMarker=null; }
  pendingPin=null;
  document.getElementById("pinhint").textContent =
    "Click anywhere on the map to drop an exact pin. Otherwise the city centre is used.";
  document.getElementById("err").style.display="none";
}

document.getElementById("add").onclick = openModal;
document.getElementById("cancel").onclick = closeModal;
document.getElementById("ov").onclick = e => { if(e.target.id==="ov") closeModal(); };

document.getElementById("submit").onclick = () => {
  const name = document.getElementById("f-name").value.trim();
  const err = document.getElementById("err");
  if(!name){ err.textContent="Business name is required."; err.style.display="block"; return; }
  if(!formCoins.size){ err.textContent="Select at least one accepted coin."; err.style.display="block"; return; }

  const city = selCity.value;
  const rec = {
    id:"u"+Date.now(), n:name, c:selCat.value, city:city,
    a:document.getElementById("f-addr").value.trim() || city,
    ll: pendingPin || CITIES[city],
    coins:[...formCoins],
    contact:document.getElementById("f-contact").value.trim(),
    submitted:new Date().toISOString()
  };
  const arr = store.read(); arr.push(rec); store.write(arr);

  // reset form
  document.getElementById("f-name").value=""; document.getElementById("f-addr").value="";
  document.getElementById("f-contact").value="";
  formCoins.clear(); [...coinBox.children].forEach(b=>b.classList.remove("on"));
  closeModal();

  loadPlaces();
  document.getElementById("city").value = city;
  document.getElementById("q").value = "";
  activeCoins.clear(); [...chipBox.querySelectorAll(".chip")].forEach(b=>b.classList.remove("on"));
  selected = rec.id;
  render(true);
  toast("Submitted — marked PENDING until reviewed");
};

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 3200);
}

/* ---------------- events ---------------- */
document.getElementById("go").onclick = () => { selected=null; render(true); };
["q","city"].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener("keydown", e => { if(e.key==="Enter"){ selected=null; render(true); }});
  el.addEventListener("input", () => render(false));
});
document.addEventListener("keydown", e => { if(e.key==="Escape") closeModal(); });

/* ---------------- boot ---------------- */
loadPlaces();
document.getElementById("city").value = "Karachi";
render(true);
</script>
</body>
</html>
